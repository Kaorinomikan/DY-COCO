<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
    font-size: 13px; color: #1f2329; background: #fff;
    display: flex; flex-direction: column;
  }
  /* 标题栏:可拖拽区域(app-region) + X 关闭键 */
  /* 标题栏(#106 · 2026-10-24 迭代):「反馈/更新日志」双 Tab 平分一行,
     ✕ 固定右端;版本号挪到 Tab 行下的小灰字行(与页面内浮层同款)。 */
  .titlebar {
    display: flex; align-items: stretch;
    padding: 0 10px;
    -webkit-app-region: drag; user-select: none; flex-shrink: 0;
  }
  .tab {
    flex: 1 1 0; text-align: center; font-size: 13px; color: #86909c;
    cursor: pointer; padding: 12px 0 9px; position: relative;
    -webkit-app-region: no-drag;
  }
  .tab.on { color: #1f2329; font-weight: 600; }
  .tab.on::after {
    content: ""; position: absolute; left: 22%; right: 22%; bottom: 0;
    height: 2px; background: #ff7d00; border-radius: 1px;
  }
  .titlebar .xbtn { flex: 0 0 22px; align-self: center; margin-bottom: 6px; }
  .verline {
    flex-shrink: 0; font-size: 10px; color: #86909c;
    padding: 3px 16px; border-bottom: 1px solid #f2f3f5;
  }
  .xbtn {
    -webkit-app-region: no-drag;
    width: 22px; height: 22px; border: none; background: transparent;
    color: #86909c; font-size: 15px; line-height: 1; cursor: pointer;
    border-radius: 4px; font-family: inherit;
  }
  .xbtn:hover { background: #f2f3f5; color: #1f2329; }

  /* 降级说明条:只在「面板注入失败、被迫开独立窗口」时出现。
     存在的意义是把原因写在用户眼前,免得下次再出现「不知道为什么变成小窗」。 */
  .fallback {
    flex-shrink: 0; padding: 7px 12px; background: #fff7e8;
    border-bottom: 1px solid #ffe4ba; color: #a4631a;
    font-size: 11px; line-height: 1.6;
  }
  .fallback b { font-weight: 600; }

  .body { flex: 1; overflow-y: auto; padding: 14px 16px; }
  /* 视图容器(#106 · 2026-10-24 迭代):两个 Tab 各自一个 view,切换 = hidden 切换,
     表单写一半切去日志再切回,内容原样保留。 */
  .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .view[hidden] { display: none; }
  .view .body { min-height: 0; }
  /* 更新日志视图:版本卡片列表,与页面内浮层同款。 */
  .cl-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px; }
  .cl-status { font-size: 12px; color: #86909c; line-height: 1.6; margin-bottom: 8px; }
  .cl-status.err { color: #f53f3f; }
  .cl-card { border: 1px solid #e5e6eb; border-radius: 6px; padding: 9px 11px; margin-bottom: 8px; background: #fff; }
  .cl-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .cl-no { font-size: 13px; font-weight: 600; color: #1f2329; }
  .cl-date { font-size: 11px; color: #86909c; }
  .cl-now { font-size: 11px; color: #ff7d00; border: 1px solid #ff7d00; border-radius: 3px; padding: 0 4px; }
  .cl-sum { font-size: 12.5px; color: #4e5969; margin-top: 5px; line-height: 1.7; }
  .cl-list { margin: 6px 0 0; padding: 0; list-style: none; }
  .cl-list strong { display: block; color: #1f2329; }
  .cl-list li { margin-top: 10px; font-size: 12.5px; color: #4e5969; line-height: 1.7; }
  .cl-miss { font-size: 11px; color: #86909c; margin-top: 4px; line-height: 1.6; }
  .cl-foot { font-size: 11px; color: #86909c; line-height: 1.7; margin-top: 2px; }
  .cl-foot a { color: #ff7d00; text-decoration: none; cursor: pointer; }
  .cl-foot a:hover { text-decoration: underline; }
  .cl-more { font-size: 11px; color: #86909c; text-align: center; padding: 4px 0 10px; line-height: 1.6; }
  .cl-retry { text-align: center; padding: 6px 0 2px; }
  .field { margin-bottom: 13px; }
  .field label { display: block; font-size: 12px; color: #4e5969; margin-bottom: 6px; }
  .req { color: #f53f3f; }
  .types { display: flex; gap: 8px; flex-wrap: wrap; }
  .type-btn {
    padding: 5px 14px; border: 1px solid #d9dce1; border-radius: 5px;
    font-size: 12px; color: #1f2329; background: #fff; cursor: pointer; font-family: inherit;
  }
  .type-btn.on { border-color: #ff7d00; color: #ff7d00; background: #fff7f0; }
  textarea, input[type=text] {
    width: 100%; border: 1px solid #d9dce1; border-radius: 6px;
    padding: 8px 10px; font-size: 12px; color: #1f2329; font-family: inherit;
    background: #fff;
  }
  textarea { min-height: 84px; resize: vertical; }
  textarea:focus, input:focus { outline: none; border-color: #ff7d00; }

  /* 截图区:与页面内浮层面板保持同一套交互(截屏 / 粘贴 / 选择 / Ctrl+V) */
  .shot-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; flex-wrap: wrap; }
  .cap-btn {
    display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px;
    border: 1px solid #d9dce1; border-radius: 5px; background: #fff; color: #1f2329;
    font-size: 11px; cursor: pointer; font-family: inherit;
  }
  .cap-btn:hover { border-color: #ff7d00; color: #ff7d00; }
  .cap-btn[disabled] { color: #c9cdd4; border-color: #e5e6eb; cursor: default; }
  .cap-hint { font-size: 10px; color: #86909c; }
  .thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .thumb {
    position: relative; width: 92px; height: 62px; border: 1px solid #e5e6eb;
    border-radius: 6px; overflow: hidden; background: #f7f8fa;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
  .thumb .rm {
    position: absolute; top: 2px; right: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: rgba(29,33,41,.55); color: #fff; font-size: 10px;
    line-height: 16px; text-align: center; cursor: pointer; font-family: inherit;
  }
  .thumb .rm:hover { background: #f53f3f; }
  .drop {
    border: 1px dashed #c9cdd4; border-radius: 6px; padding: 10px;
    text-align: center; color: #86909c; font-size: 11px; line-height: 1.7; cursor: pointer;
  }
  .drop:hover { border-color: #ff7d00; color: #4e5969; }
  .note {
    padding: 8px 10px; background: #f7f8fa; border-radius: 6px;
    font-size: 11px; color: #4e5969; line-height: 1.7; margin-bottom: 12px;
  }

  /* 诊断信息行（2026-10-13 新增，反馈诊断包）：显示、默认勾选、可取消、可展开查看 */
  .diag { padding: 9px 10px; background: #f7f8fa; border-radius: 6px; margin-bottom: 12px; }
  .diag-top { display: flex; align-items: center; gap: 6px; }
  .diag-ck { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #1f2329; cursor: pointer; }
  .diag-ck input { margin: 0; }
  .diag-sum {
    flex: 1; font-size: 10px; color: #86909c; text-align: right;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .diag-view { flex-shrink: 0; font-size: 10px; color: #ff7d00; cursor: pointer; }
  .diag-view:hover { text-decoration: underline; }
  .diag-box {
    margin: 7px 0 0; max-height: 170px; overflow: auto; padding: 8px;
    background: #fff; border: 1px solid #e5e6eb; border-radius: 5px;
    font: 10px/1.55 Consolas, "Courier New", monospace; color: #4e5969;
    white-space: pre-wrap; word-break: break-all;
  }
  .btns { display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0; padding: 10px 16px; border-top: 1px solid #f2f3f5; }
  .btn { padding: 6px 16px; border-radius: 5px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .btn-ghost { border: 1px solid #d9dce1; background: #fff; color: #1f2329; }
  .btn-ghost:hover { background: #f7f8fa; }
  .btn-main { border: 1px solid #ff7d00; background: #ff7d00; color: #fff; }
  .btn-main:hover { background: #e56f00; }
  .btn-main[disabled] { background: #fbc899; border-color: #fbc899; cursor: default; }
  .msg { font-size: 12px; min-height: 16px; margin-right: auto; align-self: center; line-height: 1.5; }
  .msg.ok { color: #00b42a; }
  .msg.err { color: #f53f3f; }
  .done { text-align: center; padding: 60px 24px; display: none; }
  .done .ic {
    width: 44px; height: 44px; border-radius: 50%; background: #e8ffea;
    margin: 0 auto; display: flex; align-items: center; justify-content: center;
  }
  .done h2 { font-size: 15px; font-weight: 500; margin-top: 12px; }
  .done p { font-size: 12px; color: #86909c; margin-top: 6px; line-height: 1.7; }

  /* 点缩略图放大看原图 */
  .preview {
    position: fixed; inset: 0; z-index: 99; display: flex;
    align-items: center; justify-content: center; cursor: zoom-out;
    background: rgba(29,33,41,.72);
  }
  .preview img { max-width: 92vw; max-height: 92vh; border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,.4); }
</style>
</head>
<body>
  <div class="titlebar">
    <div class="tab on" id="tab-feedback" data-tab="feedback">反馈</div>
    <div class="tab" id="tab-changelog" data-tab="changelog">更新日志</div>
    <button class="xbtn" id="xbtn" title="关闭">✕</button>
  </div>

  <div class="verline" id="verline"></div>

  <div class="fallback" id="fallback" hidden></div>

  <div class="view" id="view-feedback">
  <div class="body" id="form-view">
    <div class="field">
      <label>反馈类型 <span class="req">*</span></label>
      <div class="types" id="types">
        <span class="type-btn on" data-v="功能问题">功能问题</span>
        <span class="type-btn" data-v="功能建议">功能建议</span>
        <span class="type-btn" data-v="其他">其他</span>
      </div>
    </div>
    <div class="field">
      <label>问题描述 <span class="req">*</span></label>
      <textarea id="content" placeholder="请描述你遇到的问题或想提的建议，越具体越好"></textarea>
    </div>
    <div class="field">
      <label>截图（可选，最多 3 张）</label>
      <div class="shot-bar">
        <button class="cap-btn" id="cap" type="button">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M4 8h3l2-3h6l2 3h3v11H4V8z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.2" stroke="currentColor" stroke-width="1.8"/></svg>
          截屏</button>
        <button class="cap-btn" id="paste" type="button">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><rect x="5" y="4" width="14" height="17" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M9 4V2.8A1.8 1.8 0 0 1 10.8 1h2.4A1.8 1.8 0 0 1 15 2.8V4" stroke="currentColor" stroke-width="1.8"/></svg>
          粘贴截图</button>
        <span class="cap-hint">用系统截图工具后点此一键贴入</span>
      </div>
      <div class="thumbs" id="thumbs"></div>
      <div class="drop" id="drop">点击选择图片，或直接 Ctrl+V 粘贴截图<br>大图会自动压缩</div>
      <input type="file" id="file" accept="image/*" hidden>
    </div>
    <div class="field">
      <label>联系方式（可选）</label>
      <input type="text" id="contact" placeholder="微信号 / 手机号，方便我们回访">
    </div>
    <div class="diag">
      <div class="diag-top">
        <label class="diag-ck"><input type="checkbox" id="diag" checked><span>附带诊断信息</span></label>
        <span class="diag-sum" id="diag-sum"></span>
        <span class="diag-view" id="diag-view">查看</span>
      </div>
      <pre class="diag-box" id="diag-box" hidden></pre>
    </div>
    <div class="diag">
      <div class="diag-top">
        <label class="diag-ck"><input type="checkbox" id="domck" checked><span>导出页面结构</span></label>
        <span class="diag-sum" id="dom-sum"></span>
        <span class="diag-view" id="dom-view">查看</span>
      </div>
      <pre class="diag-box" id="dom-box" hidden></pre>
    </div>
    <div class="note">提交时附带扩展版本与勾选的附加信息（页面地址打码、输入内容不采集；各勾选行可展开查看实际内容）。关闭窗口前，草稿会一直保留。</div>
  </div>

  <div class="done" id="done-view">
    <div class="ic">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M5 12.5L10 17.5L19 7.5" stroke="#00b42a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h2>反馈已提交</h2>
    <p>感谢你的反馈！我们每天会汇总查看，<br>留下联系方式的话会尽快回复你。</p>
  </div>

  <div class="btns" id="btns">
    <span class="msg" id="msg"></span>
    <button class="btn btn-main" id="submit">提交反馈</button>
  </div>
  </div>

  <div class="view" id="view-changelog" hidden>
    <div class="cl-body">
      <div class="cl-status" id="cl-status"></div>
      <div id="cl-list"></div>
    </div>
  </div>

  <!-- flags.js 只为诊断采集提供开关真源与档位读取；diag.js 是采集内核。
       两者都在 feedback.js 之前，diag 出错也不影响表单本身。 -->
  <script src="../content/flags.js"></script>
  <script src="../content/diag.js"></script>
  <script src="feedback.js"></script>
</body>
</html>
